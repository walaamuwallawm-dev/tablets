<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجز التابلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly school staff-room tool, calm and quick.
   IDEA: the paper booking sheet pinned on the chalkboard by the tablet cart.
   PICTURE: the day's 8-period sheet itself, two lanes (1–3 / 4–5).
   COLOUR and TYPE: chalkboard green, paper white, coral pin; Lalezar titles + IBM Plex Sans Arabic.
   LAYOUT: board header with week + day tabs, the sheet below, modal for booking. */
:root{color-scheme:light dark;
--bg:light-dark(#eef3ee,#0f1d17);--board:light-dark(#1f4d3a,#163a2c);--paper:light-dark(#fff,#18281f);
--ink:light-dark(#15241c,#e8f0ea);--mute:light-dark(#5d7066,#9db3a6);--line:light-dark(#dbe5dd,#2a3f33);
--coral:#ff6b4a;--a:light-dark(#2f7d5b,#5cc596);--b:light-dark(#3a64b0,#7aa2ea);--free:light-dark(#f5f9f5,#1d3127)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit}
header{background:var(--board);color:#fff;padding:22px max(4vw,14px) 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1000px;margin:auto}
h1{font:400 clamp(30px,6vw,44px)/1.05 Lalezar,sans-serif;margin:0;flex:1}
.gear{background:#ffffff1f;color:#fff;border:0;border-radius:12px;height:44px;padding:0 14px;cursor:pointer}
.week{display:flex;align-items:center;gap:8px;max-width:1000px;margin:14px auto 0}
.week b{flex:1;text-align:center;font-size:clamp(20px,5vw,26px)}
.nav{width:44px;height:44px;border-radius:50%;border:0;background:#ffffff22;color:#fff;font-size:22px;cursor:pointer}
.nav:disabled{opacity:.3;cursor:default}
.note{max-width:1000px;margin:6px auto 0;text-align:center;font-size:16px;color:#cfe3d7}
.note.hot{color:#fff;font-weight:700}.note.hot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--coral);margin-inline-end:6px}
.pin{display:inline-block;font-size:11px;font-weight:700;background:#fff3;border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--coral)}
.days{display:flex;gap:6px;max-width:1000px;margin:16px auto 0;overflow-x:auto}
.day{flex:1 0 74px;border:0;border-radius:14px 14px 0 0;background:#ffffff18;color:#fff;padding:10px 4px;cursor:pointer;line-height:1.2}
.day small{display:block;opacity:.8;font-size:13px}
.day.done{opacity:.55;order:9}.day.done small::after{content:" • انتهى"}
.day.on{opacity:1;background:var(--bg);color:var(--ink);font-weight:700}
.day.today small::after{content:" • اليوم";color:var(--coral)}
main{max-width:1000px;margin:auto;padding:18px max(4vw,14px) 40px}
.sheet{background:var(--paper);border-radius:18px;box-shadow:0 1px 0 var(--line),0 10px 30px #0001;overflow:hidden}
.sheet{overflow-x:auto}
.row{display:grid;grid-template-columns:48px repeat(3,minmax(100px,1fr));border-top:1px solid var(--line)}
.row.head{border:0;font-size:14px;font-weight:700}
.row.head div{padding:12px 10px}
.row.head small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
.slot.bk i.t{display:block;font-style:normal;font-size:11px;opacity:.9;direction:ltr;text-align:right}
.row.head .lk{color:light-dark(#0f8f84,#4fd1c5)}.row.head .la{color:var(--a)}.row.head .lb{color:var(--b)}
.pn{display:grid;place-items:center;font:400 26px Lalezar,sans-serif;color:var(--mute);background:var(--free)}
.cell{padding:8px;border-inline-start:1px solid var(--line)}
.tm{font-size:13px;color:var(--mute);white-space:nowrap;direction:ltr;text-align:right}
.slot{width:100%;min-height:52px;border-radius:12px;border:2px dashed var(--line);background:transparent;color:var(--mute);cursor:pointer;text-align:start;padding:6px 10px}
.slot:hover,.slot:focus-visible{border-color:var(--coral);color:var(--ink);outline:none}
.slot.bk{border:0;color:#fff;cursor:pointer}
.slot.bk{background:#6b7c72}
.g0{background-color:#14b8a6!important}.g1{background-color:#2f6fd6!important}.g2{background-color:#2e9c5a!important}.g3{background-color:#7a4fd0!important}
.g4{background-color:#e0559a!important}.g5{background-color:#f2c230!important;color:#3a2c00!important}.fx{background-color:#f07a1a!important}
.legend i.g0,.legend i.g1,.legend i.g2,.legend i.g3,.legend i.g4,.legend i.g5,.legend i.fx{box-shadow:0 2px 0 #0003}
/* كبسة ثلاثية الأبعاد */
.slot.bk{border-radius:14px;margin-bottom:5px;background-image:linear-gradient(to bottom,#ffffff38,#ffffff00 45%,#0000001a);
  box-shadow:0 5px 0 #00000040,0 9px 14px #0000002a,inset 0 2px 0 #ffffff55,inset 0 -2px 0 #0000001f;
  text-shadow:0 1px 1px #00000040;transition:transform .08s,box-shadow .08s}
.slot.bk:hover{transform:translateY(-1px);box-shadow:0 6px 0 #00000040,0 11px 16px #0000002e,inset 0 2px 0 #ffffff55,inset 0 -2px 0 #0000001f}
.slot.bk:active{transform:translateY(4px);box-shadow:0 1px 0 #00000040,0 3px 6px #00000022,inset 0 2px 0 #ffffff55}
.slot.g5{text-shadow:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:13px;margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.slot.bk b{display:block;font-size:17px;line-height:1.3}.slot.bk span{font-size:13px;opacity:.9}
.slot.past{opacity:.55}
.cell{display:flex;flex-direction:column;gap:6px}
.slot.bk{min-height:0;padding:6px 10px}
.slot.bk em{font-style:normal;font-size:22px;font-weight:900;line-height:1;background:linear-gradient(to bottom,#ffffff,#e4e9e6);color:#15241c;border-radius:11px;padding:5px 9px;float:inline-end;margin-inline-start:6px;min-width:38px;text-align:center;text-shadow:0 1px 0 #fff,0 2px 3px #0000003a;box-shadow:0 4px 0 #0000004d,0 6px 8px #00000030,inset 0 -2px 0 #00000014,inset 0 1px 0 #fff}
.slot.none{border:0;min-height:36px;cursor:default;text-align:center;opacity:.4}
.slot.full{border:2px solid light-dark(#f2b8b0,#7a2a22);background:light-dark(#fdecea,#3a1714);color:light-dark(#c0392b,#ff8a7a);font-weight:800;cursor:default;font-size:14px;min-height:40px;text-align:center;display:grid;place-items:center}
.slot.av{color:light-dark(#1e8e4f,#5ad08c);border-color:light-dark(#8fd3a8,#2f6b47);background:light-dark(#f1fbf4,#16271c);font-weight:800;font-size:15px}
.slot.av:hover,.slot.av:focus-visible{border-color:#1e8e4f;color:#157a42;border-style:solid}
.note-v{background:light-dark(#fff8e1,#2c2610);border-radius:12px;padding:10px 12px;margin:0 0 10px;color:var(--ink);font-size:15px;white-space:pre-wrap}
textarea{width:100%;min-height:80px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px;resize:vertical}
.status{text-align:center;color:var(--mute);font-size:14px;margin:10px 0}
.err{color:var(--coral)}
.dlg{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:16px;z-index:9}
.dlg.on{display:grid}
.box{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px;width:min(420px,100%);max-height:90vh;overflow:auto}
.box h2{font:400 26px/1.1 Lalezar,sans-serif;margin:0 0 4px}
.box p{margin:0 0 14px;color:var(--mute);font-size:14px}
label{display:block;font-size:14px;font-weight:500;margin:10px 0 4px}
input,select{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font-size:16px}
input:focus,select:focus{outline:2px solid var(--coral);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;height:46px;border-radius:12px;border:0;cursor:pointer;font-weight:700}
.go{background:var(--coral);color:#fff}.no{background:var(--free);color:var(--ink)}
.del{background:#c0392b;color:#fff}.ed{background:var(--board);color:#fff}
.req{display:block;margin:18px auto 0;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;min-height:44px}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}.mrow span{flex:1}
.mrow button{height:38px;border-radius:10px;border:0;padding:0 12px;cursor:pointer;font-weight:700}
.mh{font-weight:700;margin:14px 0 4px;font-size:14px}
.tgrid{display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;align-items:center}
.tgrid input{height:40px;font-size:15px;direction:ltr;text-align:center}
.tgrid .h{font-size:13px;font-weight:700}
.msg{min-height:20px;font-size:14px;color:var(--coral);margin-top:8px}
@media(max-width:600px){.row{grid-template-columns:32px repeat(3,minmax(96px,1fr))}.slot.bk i.t{font-size:10px}.slot.bk b{font-size:15px}.slot.bk em{font-size:17px;padding:3px 6px;min-width:28px}.slot.bk span{font-size:12px}.tm{font-size:11px}.pn{font-size:22px}.cell{padding:6px}.slot{padding:6px 8px}}
@media(prefers-reduced-motion:no-preference){.box{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:0}}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>حجز التابلت</h1><button class="gear" id="out">دخول</button><button class="gear" id="gear" hidden>أوقات الحصص</button></div>
  <div class="week"><button class="nav" id="prev" aria-label="الأسبوع السابق">›</button><b id="wk"></b><button class="nav" id="next" aria-label="الأسبوع التالي">‹</button></div>
  <div class="note" id="note"></div>
  <div class="days" id="days"></div>
</header>
<main>
  <div class="legend"><span><i class="g0"></i>الروضة</span><span><i class="g1"></i>الأول</span><span><i class="g2"></i>الثاني</span><span><i class="g3"></i>الثالث</span><span><i class="g4"></i>الرابع</span><span><i class="g5"></i>الخامس</span><span><i class="fx"></i>حجز ثابت</span></div>
  <div class="sheet" id="sheet"></div>
  <div class="status" id="st">جاري تحميل الحجوزات…</div>
</main>

<div class="dlg" id="dlgBook"><form class="box" id="fBook">
  <h2 id="bT">حجز</h2><p id="bS"></p>
  <label for="tName">اسم المعلمة</label><input id="tName" required autocomplete="name">
  <div class="two">
    <div><label for="grade">الصف</label><select id="grade" required></select></div>
    <div><label for="sec">الشعبة</label><select id="sec"></select></div>
  </div>
  <label for="cnt">عدد التابلت</label><input id="cnt" type="number" inputmode="numeric" min="1" required>
  <div id="noteRow" hidden><label for="note">ملاحظات (للمشرفات)</label><textarea id="note" maxlength="200" placeholder="اكتبي أي ملاحظة على الحجز"></textarea></div>
  <label class="chk" id="fixRow" hidden><input type="checkbox" id="fix"> حجز ثابت كل أسبوع بنفس اليوم والحصة</label>
  <div class="msg" id="bMsg"></div>
  <div class="acts"><button class="go" type="submit">احجزي</button><button class="no" type="button" data-close>إلغاء</button></div>
</form></div>

<div class="dlg" id="dlgView"><div class="box">
  <h2 id="vT"></h2><p id="vS"></p><div class="note-v" id="vN" hidden></div>
  <div class="msg" id="vMsg"></div>
  <div class="acts"><button class="ed" id="vEdit" type="button">تعديل</button><button class="del" id="vDel" type="button">إلغاء الحجز</button><button class="no" type="button" data-close>رجوع</button></div>
</div></div>

<div class="dlg" id="dlgLogin"><form class="box" id="fLogin">
  <h2>أهلًا فيكِ</h2><p id="lP">اكتبي إيميل المدرسة تبعك، وبيوصلك كود دخول على الإيميل.</p>
  <div id="stepE"><label for="email">إيميل المدرسة</label><input id="email" type="email" inputmode="email" autocomplete="email" dir="ltr" required></div>
  <div id="stepC" hidden><label for="otp">الكود (٦ أرقام)</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr"></div>
  <div class="msg" id="lMsg"></div>
  <div class="acts"><button class="go" type="submit" id="lGo">ابعتيلي الكود</button><button class="no" type="button" id="lBack" hidden>تغيير الإيميل</button><button class="no" type="button" id="lCancel">إلغاء</button></div>
</form></div>

<div class="dlg" id="dlgTimes"><form class="box" id="fTimes">
  <h2>أوقات الحصص</h2><p>اكتبي بداية ونهاية كل حصة، مثل 7:45 - 8:25</p>
  <label for="tDay">لأي يوم؟</label><select id="tDay"><option value="all">كل الأيام (الأساسي)</option><option value="0">الأحد</option><option value="1">الإثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option></select>
  <div class="tgrid" id="tgrid"></div>
  <div class="msg" id="tMsg"></div>
  <div class="acts"><button class="go" type="submit">حفظ</button><button class="no" type="button" data-close>إلغاء</button></div>
</form></div>

<script>
{
// ← الصقي هون رابط الـ Web app من Google Apps Script
const API_URL="https://script.google.com/macros/s/AKfycbwPEcfCTu6pDPnIRRPeMAdnjL5YwRFgM70u3431chJMc2pgRsC9aUU9lf6SKaVCuVh4fw/exec";

const DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];
// الروضة والأول–الثالث بيشتركوا بنفس الـ١٥ تابلت (pool)
const LANES={k:{name:"الروضة",n:15,pool:"a",max:6,grades:["روضة أولى","روضة ثانية"]},a:{name:"الأول – الثالث",n:15,pool:"a",max:8,grades:["الأول","الثاني","الثالث"]},b:{name:"الرابع – الخامس",n:20,pool:"b",max:8,grades:["الرابع","الخامس"]}};
const ORDER=["k","a","b"];
const poolLanes=g=>ORDER.filter(x=>LANES[x].pool===LANES[g].pool);
const AB=["أ","ب","ج","د","هـ","و"];
const SECS={"روضة أولى":["العنبر","البنفسج","المنثور","الريحان"],"روضة ثانية":["القرنفل","السوسن","النرجس","الزنبق","الورد"]};
const secsOf=gr=>SECS[gr]||AB;
// أوقات الحصص الافتراضية (المشرفات بيقدروا يغيروها من زر «أوقات الحصص»)
const DEF_TIMES={
  a:["8:00 - 8:40","8:40 - 9:20","9:35 - 10:15","11:05 - 11:45","11:45 - 12:25","12:25 - 1:00","1:20 - 1:55","1:55 - 2:30"],
  "روضة أولى":["9:10 - 9:40","9:40 - 10:10","10:45 - 11:15","11:15 - 11:45","11:45 - 12:15","12:15 - 12:45"],
  "روضة ثانية":["9:20 - 9:50","9:50 - 10:20","10:50 - 11:20","11:20 - 11:50","11:50 - 12:20","12:20 - 12:50"],
  b:["8:00 - 8:40","9:10 - 9:50","10:00 - 10:40","10:40 - 11:20","11:40 - 12:20","12:20 - 1:00","1:10 - 1:50","1:50 - 2:30"]};
// أوقات خاصة لأيام معيّنة (٢ = الثلاثاء، ٤ = الخميس) — بتنعبى لما توصل
const DEF_DAY={};
const GC={"روضة أولى":"g0","روضة ثانية":"g0","الأول":"g1","الثاني":"g2","الثالث":"g3","الرابع":"g4","الخامس":"g5"};
const P=8,SWITCH_HOUR=14;
const maxAhead=()=>{const n=new Date();return n.getDay()===4&&n.getHours()<SWITCH_HOUR?1:0};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get:k=>{try{return localStorage.getItem(k)||""}catch(_){return ""}},set:(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(_){}}};

function baseSunday(){
  const now=new Date(),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),w=d.getDay();
  let sun=addDays(d,-w);
  if(w===5||w===6||(w===4&&now.getHours()>=SWITCH_HOUR))sun=addDays(sun,7);
  return sun;
}
let base=baseSunday(),off=0,dayIdx=0,bookings={},fixed={},times={};
let token=store.get("tb_token"),myName=store.get("tb_me"),role=null,pending=null,loadSeq=0;
const isAdmin=()=>role==="admin";

const weekStart=()=>addDays(base,off*7);
const fmt=d=>`${d.getDate()}/${d.getMonth()+1}`;
function pickDefaultDay(){const t=key(new Date());dayIdx=0;for(let i=0;i<5;i++)if(key(addDays(weekStart(),i))===t)dayIdx=i}
const cntOf=(x,g)=>Math.max(1,Math.min(LANES[g].n,+x.count||LANES[g].n));
function slotList(date,g,p){return [...(fixed[`${dayIdx}_${g}_${p}`]||[]),...(bookings[`${date}_${g}_${p}`]||[])]}
// تحويل "1:20 - 1:55" لدقائق (الساعات من ١ لـ ٦ بعد الظهر)
function span(t){const m=String(t||"").match(/(\d+):(\d+)\s*-\s*(\d+):(\d+)/);if(!m)return null;const f=(h,mi)=>{h=+h;if(h<7)h+=12;return h*60+ +mi};return [f(m[1],m[2]),f(m[3],m[4])]}
// التابلت المستعملة بنفس الوقت من كل الخانات المشتركة (الروضة + الأول–الثالث)
// وقت الحصة: الروضة حسب الصف (أولى/ثانية)، والباقي حسب الخانة
const tOf=(g,p,grade)=>g==="k"?(DEF_TIMES[grade]||[])[p-1]:timesFor(dayIdx,g)[p-1];
// كم تابلت مستعملة بنفس وقت هالحصة (grade للروضة)
function poolUsed(date,g,p,grade){
  const me=span(tOf(g,p,grade));let sum=0;
  poolLanes(g).forEach(x=>{for(let q=1;q<=LANES[x].max;q++){
    slotList(date,x,q).forEach(b=>{
      const o=span(tOf(x,q,b.grade));
      const hit=(x===g&&q===p&&(g!=="k"||b.grade===grade))||(me&&o&&me[0]<o[1]&&o[0]<me[1]);
      if(hit)sum+=cntOf(b,x);
    });
  }});
  return sum;
}
// للخانة: أكثر عدد متاح (بالروضة بين أولى وثانية)
const cellLeft=(date,g,p)=>g==="k"?Math.max(...LANES.k.grades.map(gr=>LANES.k.n-poolUsed(date,g,p,gr))):LANES[g].n-poolUsed(date,g,p);
function timesFor(d,g){
  const pick=o=>o&&o[g]&&o[g].some(Boolean)?o[g]:null;
  return pick(times[String(d)])||pick(DEF_DAY[d])||pick(times.all)||DEF_TIMES[g];
}
const used=(list,g)=>list.reduce((a,x)=>a+cntOf(x,g),0);

// ===== الاتصال بـ Google Sheets =====
async function apiGet(params){
  const u=API_URL+"?"+new URLSearchParams({...params,token}).toString();
  const r=await fetch(u);return r.json();
}
async function apiPost(body){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,token})});
  return r.json();
}

function renderHead(){
  const s=weekStart(),ma=maxAhead();if(off>ma)off=ma;
  $("wk").textContent=`أسبوع ${fmt(s)} – ${fmt(addDays(s,4))}`;
  $("prev").disabled=off<=0;$("next").disabled=off>=ma;
  $("note").textContent=ma&&off===0?"جدول الأسبوع الجاي صار متاح، اضغطي السهم ‹":(ma?"الأسبوع الحالي بيختفي اليوم الساعة ٢:٠٠":"جدول الأسبوع الجاي بيظهر يوم الخميس");
  $("note").classList.toggle("hot",!!ma&&off===0);
  const t=key(new Date());
  // الأيام اللي خلصت بتنقلب لآخر القائمة
  $("days").innerHTML=DAYS.map((n,i)=>{const d=addDays(s,i),k=key(d);
    return `<button class="day${i===dayIdx?" on":""}${k===t?" today":""}${k<t?" done":""}" data-i="${i}">${n}<small>${fmt(d)}</small></button>`}).join("");
}
function renderSheet(){
  const date=key(addDays(weekStart(),dayIdx)),past=date<key(new Date());
  let h=`<div class="row head"><div></div><div class="lk">${LANES.k.name}<small>من نفس الـ15</small></div><div class="la">${LANES.a.name}<small>${LANES.a.n} تابلت</small></div><div class="lb">${LANES.b.name}<small>${LANES.b.n} تابلت</small></div></div>`;
  for(let p=1;p<=P;p++){
    h+=`<div class="row"><div class="pn">${p}</div>`+ORDER.map(g=>{
      if(p>LANES[g].max)return `<div class="cell ${g}"><div class="slot none">—</div></div>`;
      const list=slotList(date,g,p),left=cellLeft(date,g,p),tm=g==="k"?"":timesFor(dayIdx,g)[p-1];
      let c=`<div class="cell ${g}">`+(tm?`<div class="tm">${esc(tm)}</div>`:"");
      c+=list.map(x=>`<button class="slot bk ${x.fixed?"fx":(GC[x.grade]||"")}${past?" past":""}" data-g="${g}" data-p="${p}" data-k="${x.fixed?"f":"b"}" data-id="${esc(x.id)}"><em>${cntOf(x,g)}</em><b>${esc(x.teacher)}${x.fixed?'<i class="pin">ثابت</i>':""}${x.note?'<i class="pin">ملاحظة</i>':""}</b><span>${esc(x.cls)}</span>${g==="k"?`<i class="t">${esc(tOf("k",p,x.grade)||"")}</i>`:""}</button>`).join("");
      if(past)c+=list.length?"":`<button class="slot past" disabled>—</button>`;
      else if(left>0)c+=`<button class="slot av" data-g="${g}" data-p="${p}" data-new="1">+ متاح ${left===LANES[g].n?"":`(باقي ${left})`}</button>`;
      else c+=`<div class="slot full">محجوزة بالكامل</div>`;
      return c+`</div>`;
    }).join("")+`</div>`;
  }
  $("sheet").innerHTML=h;
}
function render(){renderHead();renderSheet()}

function open(id){$(id).classList.add("on")}
function close(){document.querySelectorAll(".dlg.on:not(#dlgLogin)").forEach(d=>d.classList.remove("on"));pending=null}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
document.querySelectorAll(".dlg:not(#dlgLogin)").forEach(d=>d.onclick=e=>{if(e.target===d)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
function slotLabel(g,p){const d=addDays(weekStart(),dayIdx);return `${DAYS[dayIdx]} ${fmt(d)} • الحصة ${p} • ${LANES[g].name}`}
function setStatus(t,err){$("st").textContent=t;$("st").className="status"+(err?" err":"")}
const clsOf=x=>`${/^روضة/.test(x.grade)?"":"الصف "}${x.grade}${x.sec?" / "+x.sec:""}`;

async function load(quiet){
  const seq=++loadSeq;if(!quiet)setStatus("جاري تحميل الحجوزات…");
  try{
    const r=await apiGet({week:key(weekStart())});
    if(seq!==loadSeq)return;
    if(!r.ok){setStatus("صار خطأ بتحميل الحجوزات.",1);return}
    if(token&&!r.role){token="";store.set("tb_token","")}
    const m={},f={};
    const fixLane=x=>{if(x.lane==="k1"||x.lane==="k2")x.lane="k"};
    r.bookings.forEach(x=>{fixLane(x);x.cls=clsOf(x);const k=`${x.date}_${x.lane}_${x.period}`;(m[k]=m[k]||[]).push(x)});
    r.fixed.forEach(x=>{fixLane(x);x.cls=clsOf(x);x.fixed=true;const k=`${x.day}_${x.lane}_${x.period}`;(f[k]=f[k]||[]).push(x)});
    Object.values(m).forEach(l=>l.sort((a,b)=>(+a.at||0)-(+b.at||0)));
    bookings=m;fixed=f;times=r.times||{};role=r.role||null;$("out").textContent=role?"خروج":"دخول";if(r.name){myName=r.name;store.set("tb_me",myName)}
    $("gear").hidden=!isAdmin();renderSheet();
    setStatus(!role?"للحجز اضغطي «متاح» وادخلي بإيميل المدرسة":`أهلًا ${myName||""} • `+(isAdmin()?"إنتِ مشرفة، اضغطي على أي حجز لتعديله":"اضغطي على «متاح» للحجز"));
  }catch(_){if(seq===loadSeq)setStatus("ما قدرنا نوصل للحجوزات، تأكدي من الإنترنت.",1)}
}

$("days").onclick=e=>{const b=e.target.closest(".day");if(!b)return;dayIdx=+b.dataset.i;render()};
$("prev").onclick=()=>{if(off>0){off--;pickDefaultDay();bookings={};render();load()}};
$("next").onclick=()=>{if(off<maxAhead()){off++;dayIdx=0;bookings={};render();load()}};

function fillSecs(sel){$("sec").innerHTML=secsOf($("grade").value).map(y=>`<option${y===sel?" selected":""}>${y}</option>`).join("")}
// العدد المتاح بيتغير حسب الصف (للروضة الوقت بيختلف بين أولى وثانية)
function updLeft(keep){
  const q=pending;if(!q)return;const gr=$("grade").value;
  let left=LANES[q.g].n-poolUsed(q.date,q.g,q.p,gr);
  if(q.edit&&q.x){const same=q.g!=="k"||q.x.grade===gr;const o=span(tOf(q.g,q.p,q.x.grade)),me=span(tOf(q.g,q.p,gr));if(same||(o&&me&&me[0]<o[1]&&o[0]<me[1]))left+=cntOf(q.x,q.g)}
  left=Math.max(0,left);
  const tm=tOf(q.g,q.p,gr);
  $("bS").textContent=`${slotLabel(q.g,q.p)}${tm?" • "+tm:""} • متاح ${left} من ${LANES[q.g].n}`;
  $("cnt").max=left;if(!keep||+$("cnt").value>left)$("cnt").value=left;
  $("bMsg").textContent=left?"":"ما في تابلت متاحة لهالصف بهالوقت.";
  $("fBook").querySelector(".go").disabled=!left;
}
$("grade").onchange=()=>{fillSecs();updLeft()};
function openBook(g,p,left,x){
  $("grade").innerHTML=LANES[g].grades.map(y=>`<option${x&&y===x.grade?" selected":""}>${y}</option>`).join("");
  fillSecs(x&&x.sec);
  $("tName").value=x?x.teacher:(myName||"");$("tName").readOnly=!isAdmin();
  $("bMsg").textContent="";if(x)$("cnt").value=cntOf(x,g);updLeft(!!x);
  $("fixRow").hidden=!isAdmin()||!!x;$("fix").checked=false;
  $("noteRow").hidden=!isAdmin();$("note").value=x&&x.note||"";
  open("dlgBook");
}
$("sheet").onclick=e=>{
  const b=e.target.closest("button.slot");if(!b||b.disabled)return;
  const g=b.dataset.g,p=+b.dataset.p,date=key(addDays(weekStart(),dayIdx));
  if(b.dataset.new&&!role){openLogin();return}
  if(b.dataset.new){
    pending={g,p,date};
    $("bT").textContent="حجز التابلت";
    openBook(g,p,0);return;
  }
  const isFixed=b.dataset.k==="f",list=isFixed?fixed[`${dayIdx}_${g}_${p}`]:bookings[`${date}_${g}_${p}`],x=(list||[]).find(y=>y.id===b.dataset.id);if(!x)return;
  pending={g,p,date,x,isFixed};
  $("vT").textContent=x.teacher;
  $("vS").textContent=`${x.cls} • ${cntOf(x,g)} تابلت — ${slotLabel(g,p)}${isFixed?" — حجز ثابت كل أسبوع":""}`;$("vN").textContent=x.note?"ملاحظة: "+x.note:"";$("vN").hidden=!x.note;$("vMsg").textContent="";
  const can=isAdmin()&&(isFixed||date>=key(new Date()));
  $("vDel").textContent=isFixed?"إلغاء الحجز الثابت":"إلغاء الحجز";$("vDel").dataset.sure="";
  $("vDel").hidden=!can;$("vEdit").hidden=!can;
  open("dlgView");
};
$("vEdit").onclick=()=>{
  const q=pending;if(!q||!isAdmin())return;const {x,g,p,date}=q;
  document.querySelectorAll(".dlg.on").forEach(d=>d.classList.remove("on"));
  pending={...q,edit:true};
  $("bT").textContent="تعديل الحجز";
  openBook(g,p,0,x);
};

const ERR={full:r=>r.left>0?`الباقي ${r.left} تابلت بس.`:"للأسف الحصة انحجزت بالكامل هلأ.",busy:()=>"في حدا عم يحجز هلأ، جربي بعد ثواني.",perm:()=>"هاد بس للمشرفات.",past:()=>"ما بنقدر نحجز بيوم خلص.",gone:()=>"هالحجز انمسح من قبل.",auth:()=>"انتهت صلاحية الدخول، ادخلي من جديد."};
const errMsg=r=>(ERR[r&&r.error]||(()=>"صار خطأ، جربي كمان مرة."))(r||{});

$("fBook").onsubmit=async e=>{
  e.preventDefault();const q=pending;if(!q)return;
  const teacher=$("tName").value.trim(),sec=$("sec").value.trim(),count=Math.floor(+$("cnt").value),grade=$("grade").value;
  if(!teacher){$("bMsg").textContent="اكتبي الاسم";return}
  if(!(count>=1)){$("bMsg").textContent="اكتبي عدد التابلت";return}
  const btn=$("fBook").querySelector(".go");btn.disabled=true;$("bMsg").textContent="جاري الحفظ…";
  try{
    const body={lane:q.g,period:q.p,teacher,grade,sec,count,note:isAdmin()?$("note").value.trim():""};
    const r=q.edit?await apiPost({action:"edit",id:q.x.id,fixed:q.isFixed,...body})
      :($("fix").checked&&isAdmin())?await apiPost({action:"addFixed",day:dayIdx,...body})
      :await apiPost({action:"book",date:q.date,day:dayIdx,week:key(weekStart()),...body});
    if(r.ok){close();load(true)}else{$("bMsg").textContent=errMsg(r);if(r.error==="auth"){close();logout();openLogin()}}
  }catch(_){$("bMsg").textContent="ما قدرنا نوصل، تأكدي من الإنترنت."}
  finally{btn.disabled=false}
};
$("vDel").onclick=async()=>{
  const q=pending;if(!q)return;
  if($("vDel").dataset.sure!=="1"){$("vDel").dataset.sure="1";$("vDel").textContent="متأكدة؟ اضغطي مرة ثانية";return}
  try{const r=await apiPost({action:"del",id:q.x.id,fixed:q.isFixed});if(r.ok){close();load(true)}else $("vMsg").textContent=errMsg(r)}
  catch(_){$("vMsg").textContent="ما زبط الإلغاء، جربي كمان مرة."}
};
function fillTimes(){
  const d=$("tDay").value,ta=d==="all"?timesFor("all","a"):timesFor(+d,"a"),tb=d==="all"?timesFor("all","b"):timesFor(+d,"b");
  let h=`<div></div><div class="h">${LANES.a.name}</div><div class="h">${LANES.b.name}</div>`;
  for(let i=0;i<P;i++)h+=`<div class="h">${i+1}</div><input id="ta${i}" value="${esc(ta[i])}" placeholder="7:45 - 8:25"><input id="tb${i}" value="${esc(tb[i])}" placeholder="7:45 - 8:25">`;
  $("tgrid").innerHTML=h;$("tMsg").textContent="";
}
$("tDay").onchange=fillTimes;
$("gear").onclick=()=>{$("tDay").value=String(dayIdx);fillTimes();open("dlgTimes")};
$("fTimes").onsubmit=async e=>{
  e.preventDefault();
  const a=[],b=[];for(let i=0;i<P;i++){a.push($("ta"+i).value.trim());b.push($("tb"+i).value.trim())}
  try{const r=await apiPost({action:"times",day:$("tDay").value,times:{a,b}});if(r.ok){close();load(true)}else $("tMsg").textContent=errMsg(r)}
  catch(_){$("tMsg").textContent="ما زبط الحفظ."}
};

// ===== الدخول بإيميل المدرسة =====
let step="e";
function showStep(e){step=e;$("stepE").hidden=e!=="e";$("stepC").hidden=e!=="c";$("lBack").hidden=e!=="c";$("email").required=e==="e";
  $("lGo").textContent=e==="e"?"ابعتيلي الكود":"دخول";
  $("lP").textContent=e==="e"?"اكتبي إيميل المدرسة تبعك، وبيوصلك كود دخول على الإيميل.":`بعتنا كود على ${$("email").value.trim()} — إذا ما لقيتيه شوفي Junk.`;
  if(e==="c")setTimeout(()=>$("otp").focus(),50)}
function openLogin(){$("otp").value="";$("lMsg").textContent="";showStep("e");open("dlgLogin")}
function logout(){token="";role=null;store.set("tb_token","");$("gear").hidden=true;$("out").textContent="دخول";renderSheet();load(true)}
$("out").onclick=()=>role?logout():openLogin();
$("lCancel").onclick=()=>$("dlgLogin").classList.remove("on");
$("lBack").onclick=()=>{$("lMsg").textContent="";showStep("e")};
$("fLogin").onsubmit=async e=>{
  e.preventDefault();const email=$("email").value.trim().toLowerCase();if(!email)return;
  $("lGo").disabled=true;$("lMsg").textContent=step==="e"?"جاري الإرسال…":"جاري التحقق…";
  try{
    if(step==="e"){
      const r=await apiGet({action:"sendCode",email});
      if(r.ok){store.set("tb_email",email);$("lMsg").textContent=r.again?"الكود انبعت قبل شوي، استعملي نفس الكود.":"";showStep("c")}
      else $("lMsg").textContent=r.error==="notlisted"?"هالإيميل مش بقائمة المعلمات. احكي مع صاحبة الصفحة.":"صار خطأ، جربي كمان مرة.";
    }else{
      const r=await apiGet({action:"verify",email,otp:$("otp").value.trim()});
      if(r.ok){token=r.token;role=r.role;myName=r.name;store.set("tb_token",token);store.set("tb_me",myName);
        $("dlgLogin").classList.remove("on");load()}
      else $("lMsg").textContent=r.error==="tries"?"جربتي كتير، اطلبي كود جديد بعد ١٠ دقايق.":"الكود غلط، تأكدي منه.";
    }
  }catch(_){$("lMsg").textContent="ما قدرنا نوصل. تأكدي من الإنترنت."}
  finally{$("lGo").disabled=false}
};
$("email").value=store.get("tb_email");

setInterval(()=>{
  const nb=baseSunday();
  if(key(nb)!==key(base)){base=nb;off=0;pickDefaultDay();bookings={};render();load()}
  else if(off>maxAhead()){off=0;pickDefaultDay();bookings={};render();load()}
  else{renderHead();load(true)}
},30000);

pickDefaultDay();render();
load();
}
</script>
</body>
</html>
